apiVersion: v1
kind: ConfigMap
metadata:
  name: config-config
  namespace: redis
data:
  # The key is the 'filename', the value is the block of text
  env-file: |
    REDIS_HOST=my-redis-cluster-leader.redis.svc.cluster.local
    REDIS_PORT=6379
    REDIS_DB=0
    LOGFILE=log/log.txt
    APP_HOST=0.0.0.0
    APP_PORT=5000
    APP_DEBUG=False
    OUTPUT_DIR=output
    WHISPER_MODEL=base